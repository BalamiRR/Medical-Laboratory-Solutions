version: '3.8'

services:

  # ── Databases ──────────────────────────────
  mysql-patient:
    image: mysql:8.0
    container_name: mysql-patient
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: patient
    ports:
      - "3306:3306"
    volumes:
      - mysql_patient_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: my-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservices ───────────────────────────
  patient-service:
    build: ../patient-service
    container_name: patient-service
    ports:
      - "8080:8080"
    depends_on:
      mysql-patient:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-patient:3306/patient?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

  notes-service:
    build: ./notes-service
    container_name: notes-service
    ports:
      - "9000:9000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://my-mongodb:27017/notesdb

  risk-service:
    build: ./risk-service
    container_name: risk-service
    ports:
      - "8084:8084"
    depends_on:
      - patient-service
      - notes-service
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8080
      NOTES_SERVICE_URL: http://notes-service:9000

  frontend-service:
    build: ./frontend-service
    container_name: frontend-service
    ports:
      - "8083:8083"
    depends_on:
      - patient-service
      - notes-service
      - risk-service
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8080
      NOTES_SERVICE_URL: http://notes-service:9000
      RISK_SERVICE_URL: http://risk-service:8084

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8082:8082"
    depends_on:
      - patient-service
      - notes-service
      - frontend-service
      - risk-service

volumes:
  mysql_patient_data:
  mongo_data: