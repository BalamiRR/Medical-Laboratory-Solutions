server:
  port: 8082

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/patients/**

        - id: notes-service
          uri: http://localhost:9000
          predicates:
            - Path=/api/notes/**

        - id: risk-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/risk/**

        - id: frontend-service
          uri: http://localhost:8083
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health, info