<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:temporals="http://www.thymeleaf.org/extras/java8time" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Modifier le patient</h2>
    <form th:action="@{/patients/edit/{id}(id=${patient.id})}"
          th:object="${patient}" method="post">
        <div class="mb-3">
            <label class="form-label">Prénom *</label>
            <input type="text" class="form-control" th:field="*{firstName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom *</label>
            <input type="text" class="form-control" th:field="*{lastName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Date de naissance *</label>
            <input type="date" class="form-control"
                   th:name="birthDate"
                   th:value="${patient.birthDate}"
                   required>
        </div>
        <div class="mb-3">
            <label class="form-label">Genre *</label>
            <select class="form-select" th:field="*{gender}" required>
                <option value="M" th:selected="${patient.gender == 'M'}">Masculin</option>
                <option value="F" th:selected="${patient.gender == 'F'}">Féminin</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse <span class="text-muted">(optionnel)</span></label>
            <input type="text" class="form-control" th:field="*{address}">
        </div>
        <div class="mb-3">
            <label class="form-label">Téléphone <span class="text-muted">(optionnel)</span></label>
            <input type="text" class="form-control" th:field="*{phoneNumber}">
        </div>
        <button type="submit" class="btn btn-warning">Mettre à jour</button>
        <a href="/" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
